# 配置写在 ~/.dsh/tandem.json（推荐），或在下面用 config 覆盖。
# 完整配置项见 README.md 与 config.example.json。
- insert:
    - id: dsh-tandem
      name: dsh-tandem
      # config:
      #   codexCommand: codex            # Codex CLI 命令（PATH 内，或绝对路径）
